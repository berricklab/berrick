<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>

<div class="dashboard">

    <aside>
        <h2>Admin Panel</h2>
        <ul>
            <li>Dashboard</li>
            <li>Students</li>
            <li>Teachers</li>
            <li>Results</li>
            <li>Payments</li>
            <li>Attendance</li>
        </ul>
    </aside>

    <main>

        <div class="stats">

            <div class="stat-box">
                <h3>1200</h3>
                <p>Students</p>
            </div>

            <div class="stat-box">
                <h3>75</h3>
                <p>Teachers</p>
            </div>

            <div class="stat-box">
                <h3>98%</h3>
                <p>Pass Rate</p>
            </div>

        </div>

    </main>

</div>

</body>
</html>
